name: Stock Market Alerts Cron

on:
  schedule:
    # Start ahead of premarket and periodically recover if the active chain fails.
    - cron: '50 2-19 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      recovery:
        description: Single recovery attempt after a failed runner
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# A queued replacement must wait for the active monitor to save its alert state.
# GitHub replaces older pending runs when another scheduled trigger arrives.
concurrency:
  group: ${{ github.workflow }}-cron
  cancel-in-progress: false

jobs:
  run-script:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find saved alert state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/restore_state.py

      - name: Restore alert state
        if: steps.state.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: alert-state
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.run_id }}

      - name: Run stock alert monitor
        timeout-minutes: 352
        env:
          STOCK_SYMBOLS: ${{ secrets.stock_symbols }}
          PERCENT_CHANGE_THRESHOLD: ${{ secrets.percent_change_threshold }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u main.py --max_runtime_seconds 20700 --exit_at_market_close

      - name: Save alert state for the next runner
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alert-state
          path: alert-state.json
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

  handoff:
    needs: run-script
    # Try one fresh runner on failure. Persistent failures fall back to the hourly schedule.
    if: >-
      ${{ !cancelled() && (needs.run-script.result == 'success' ||
          (needs.run-script.result == 'failure' && !inputs.recovery)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue the next monitor while the market is open
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECOVERY: ${{ needs.run-script.result == 'failure' }}
          TZ: America/New_York
        run: |
          read -r weekday hour <<< "$(date '+%u %H')"
          if (( weekday <= 5 && 10#$hour >= 4 && 10#$hour < 20 )); then
            gh workflow run cron.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f recovery="$RECOVERY"
            echo "Queued the next monitor on $DEFAULT_BRANCH."
          else
            echo "Outside monitoring hours. The next weekday schedule will start the monitor."
          fi
