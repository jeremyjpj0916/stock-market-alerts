name: Stock Market Alerts Cron

on:
  schedule:
    # Queue a replacement hourly, with an early start ahead of 4 AM premarket.
    # Independent triggers recover from failed runs without a self-dispatch chain.
    - cron: '50 3-19 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A queued replacement must wait for the active monitor to save its alert state.
# GitHub replaces older pending runs when another scheduled trigger arrives.
concurrency:
  group: ${{ github.workflow }}-cron
  cancel-in-progress: false

jobs:
  run-script:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find saved alert state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/restore_state.py

      - name: Restore alert state
        if: steps.state.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: alert-state
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.run_id }}

      - name: Run stock alert monitor
        timeout-minutes: 352
        env:
          STOCK_SYMBOLS: ${{ secrets.stock_symbols }}
          PERCENT_CHANGE_THRESHOLD: ${{ secrets.percent_change_threshold }}
          SENDER_EMAIL: ${{ secrets.sender_email }}
          SENDER_EMAIL_HOST: ${{ secrets.sender_email_host }}
          SENDER_EMAIL_HOST_PORT: ${{ secrets.sender_email_host_port }}
          SENDER_EMAIL_PASSWORD: ${{ secrets.sender_email_password }}
          CARRIER: ${{ secrets.carrier }}
          PHONE_NUMBERS: ${{ secrets.phone_numbers }}
          RECIPIENT_EMAILS: ${{ secrets.recipient_emails }}
        run: python -u main.py --max_runtime_seconds 20700 --exit_at_market_close

      - name: Save alert state for the next runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-state
          path: alert-state.json
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true
